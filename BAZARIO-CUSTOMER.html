        c.appendChild(d);
        setTimeout(() => { d.style.opacity = '0'; setTimeout(() => d.remove(), 300); }, 3000);

                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      function renderShopDetail(shopId) {
        const s = getShop(shopId);
        if (!s || s.status !== 'approved' || !s.isOpen) { ui.activeShopId = null; return renderMarket(); }
        return `
          <div class="space-y-4">
            <button type="button" id="btn-back" class="inline-flex items-center gap-1.5 text-xs font-bold text-[#0f2942] bg-white border border-slate-200 px-3 py-1.5 rounded-xl">
              <i data-lucide="arrow-left" class="w-4 h-4"></i> सभी दुकानों पर वापस जाएं
            </button>
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
              <div>
                <span class="text-xs font-bold text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded-full">${escapeHtml(s.category)}</span>
                <h2 class="text-lg font-extrabold text-[#0f2942] mt-1">${escapeHtml(s.name)}</h2>
                <p class="text-xs text-slate-600">${escapeHtml(s.area)}, जमुई • ${s.distanceKm} किमी • डिलीवरी ₹${calcDeliveryFee(s.distanceKm)}</p>
              </div>
              <div class="text-right text-xs text-slate-500">
                <div class="font-bold text-emerald-700 text-sm">★ ${s.rating}</div>
                <div>संपर्क: ${escapeHtml(s.phone)}</div>
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
              ${s.products.map(p => {
                const inC = ui.cart.shopId === s.id ? ui.cart.items.find(i => i.productId === p.id) : null;
                const qty = inC ? inC.qty : 0;
                return `
                  <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col justify-between shadow-sm">
                    <div>
                      <span class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded">${escapeHtml(p.brand)}</span>
                      <h3 class="text-sm font-bold text-slate-900 mt-2">${escapeHtml(p.name)}</h3>
                      <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(p.desc)}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                      <div>
                        <span class="text-base font-extrabold text-[#0f2942]">₹${p.price}</span>
                        ${p.mrp > p.price ? `<span class="text-xs text-slate-400 line-through ml-1">₹${p.mrp}</span>` : ''}
                        <div class="text-[11px] ${p.stock > 0 ? 'text-emerald-600' : 'text-rose-600'} font-medium">${p.stock > 0 ? 'स्टॉक: ' + p.stock : 'स्टॉक समाप्त'}</div>
                      </div>
                      ${p.stock <= 0 ? `<span class="text-xs font-bold text-slate-400 px-3 py-1.5 bg-slate-100 rounded-xl">अनुपलब्ध</span>` :
                        qty === 0 ? `<button type="button" data-add="${s.id}|${p.id}" class="bg-amber-500 hover:bg-amber-600 text-[#0f2942] text-xs font-bold px-3.5 py-2 rounded-xl">+ कार्ट में जोड़ें</button>` :
                        `<div class="flex items-center gap-2 bg-[#0f2942] text-white rounded-xl px-2 py-1">
                          <button type="button" data-qdelta="${p.id}|-1" class="w-6 h-6 rounded font-bold">-</button>
                          <span class="text-xs font-bold w-4 text-center">${qty}</span>
                          <button type="button" data-qdelta="${p.id}|1" class="w-6 h-6 rounded font-bold">+</button>
                        </div>`}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      function renderOrders() {
        if (!shared.orders.length) return `<div class="bg-white rounded-2xl p-8 text-center border text-sm text-slate-600">अभी कोई ऑर्डर नहीं है।</div>`;
        return `<div class="space-y-3.5">${shared.orders.map(o => {
          const st = getStatusLabel(o.status);
          const steps = ['placed', 'accepted', 'ready_for_pickup', 'out_for_delivery', 'delivered'];
          const idx = steps.indexOf(o.status);
          return `
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-3">
              <div class="flex flex-wrap justify-between gap-2">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="text-sm font-extrabold text-[#0f2942]">#${escapeHtml(o.id)}</span>
                    <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${st.cls}">${escapeHtml(st.text)}</span>
                  </div>
                  <div class="text-xs font-semibold text-slate-600 mt-1">${escapeHtml(o.shopName)} (${escapeHtml(o.shopArea)})</div>
                  <div class="text-[11px] text-slate-500">${escapeHtml(o.createdAt || '')} • ${escapeHtml(o.paymentMethod)}</div>
                </div>
                <div class="text-right">
                  <div class="text-base font-extrabold text-[#0f2942]">₹${o.total}</div>
                  <div class="text-[11px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded mt-1">डिलीवरी OTP: ${escapeHtml(o.otp)}</div>
                </div>
              </div>
              <div class="text-xs bg-slate-50 p-2.5 rounded-xl text-slate-700">${o.items.map(i => `${escapeHtml(i.name)} × ${i.qty}`).join(' • ')}</div>
              ${idx >= 0 ? `<div class="grid grid-cols-5 gap-1">${['ऑर्डर', 'स्वीकृत', 'तैयार', 'रास्ते में', 'डिलीवर'].map((l, i) => `<div class="text-center"><div class="h-1.5 rounded-full ${i <= idx ? 'bg-emerald-500' : 'bg-slate-200'}"></div><div class="text-[10px] mt-1 font-semibold ${i <= idx ? 'text-emerald-700' : 'text-slate-400'}">${l}</div></div>`).join('')}</div>` : ''}
              <div class="flex flex-wrap justify-between items-center gap-2 pt-2 border-t border-slate-100 text-xs">
                <span class="text-slate-600">${o.partnerName ? 'डिलीवरी पार्टनर: ' + escapeHtml(o.partnerName) : 'ओपन डिलीवरी नेटवर्क: पार्टनर प्रतीक्षारत'}</span>
                <div class="flex gap-2">
                  ${(o.status === 'placed' || o.status === 'accepted') ? `<button type="button" data-cancel="${o.id}" class="text-rose-600 font-bold px-2.5 py-1 rounded-lg border border-rose-200">रद्द करें</button>` : ''}
                  ${o.status === 'delivered' && !o.rating ? `<button type="button" data-rate="${o.id}" class="text-amber-700 font-bold px-2.5 py-1 rounded-lg border border-amber-200">रेटिंग दें ★</button>` : o.rating ? `<span class="text-emerald-700 font-bold">रेटिंग: ${o.rating} ★</span>` : ''}
                  <button type="button" data-cmp="${o.id}" class="text-slate-600 font-semibold px-2.5 py-1 rounded-lg border border-slate-200">शिकायत</button>
                </div>
              </div>
            </div>
          `;
        }).join('')}</div>`;
      }

      function renderProfile() {
        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm max-w-lg mx-auto space-y-3">
            <h2 class="text-base font-extrabold text-[#0f2942]">ग्राहक प्रोफ़ाइल और सहेजा गया पता</h2>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">आपका नाम</label>
              <input id="prof-name" type="text" value="${escapeHtml(ui.profile.name)}" placeholder="अपना नाम लिखें" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">मोबाइल नंबर</label>
              <input id="prof-phone" type="tel" value="${escapeHtml(ui.profile.phone)}" placeholder="10-अंकीय मोबाइल नंबर" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">डिफ़ॉल्ट डिलीवरी पता (जमुई)</label>
              <input id="prof-addr" type="text" value="${escapeHtml(ui.profile.address)}" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
            </div>
            <button type="button" id="btn-save-profile" class="w-full bg-[#0f2942] text-white font-bold py-2.5 rounded-xl text-sm">प्रोफ़ाइल सेव करें</button>
          </div>
        `;
      }

      document.addEventListener('click', function (e) {
        const t = e.target;
        const tabBtn = t.closest('.nav-tab');
        if (tabBtn) { ui.tab = tabBtn.dataset.tab; ui.activeShopId = null; render(); return; }
        if (t.closest('[data-close-modal]') || t.id === 'modal-overlay') { closeModal(); return; }

        const catBtn = t.closest('.cat-chip');
        if (catBtn) { ui.selectedCategory = catBtn.dataset.cat; render(); return; }

        const favBtn = t.closest('[data-fav]');
        if (favBtn) {
          const id = favBtn.dataset.fav;
          const i = ui.favorites.indexOf(id);
          if (i >= 0) ui.favorites.splice(i, 1); else ui.favorites.push(id);
          render();
          return;
        }

        const openBtn = t.closest('[data-open-shop]');
        if (openBtn) { ui.activeShopId = openBtn.dataset.openShop; render(); return; }
        if (t.closest('#btn-back')) { ui.activeShopId = null; render(); return; }

        const addBtn = t.closest('[data-add]');
        if (addBtn) {
          const [sid, pid] = addBtn.dataset.add.split('|');
          const s = getShop(sid), p = s && s.products.find(x => x.id === pid);
          if (!s || !p) return;
          if (ui.cart.shopId && ui.cart.shopId !== sid && ui.cart.items.length > 0) {
            ui.cart = { shopId: sid, items: [{ productId: p.id, name: p.name, price: p.price, qty: 1 }] };
            showToast('पिछला कार्ट बदलकर नया कार्ट बनाया गया।', 'warning');
          } else {
            ui.cart.shopId = sid;
            ui.cart.items.push({ productId: p.id, name: p.name, price: p.price, qty: 1 });
            showToast(`${p.name} कार्ट में जोड़ा गया।`, 'success');
          }
          render();
          return;
        }

        const qBtn = t.closest('[data-qdelta]');
        if (qBtn) {
          const [pid, dStr] = qBtn.dataset.qdelta.split('|');
          const d = parseInt(dStr, 10);
          const item = ui.cart.items.find(i => i.productId === pid);
          const s = getShop(ui.cart.shopId), p = s && s.products.find(x => x.id === pid);
          if (item) {
            if (d > 0 && p && item.qty + d > p.stock) { showToast(`अधिकतम स्टॉक ${p.stock} उपलब्ध है।`, 'warning'); return; }
            item.qty += d;
            if (item.qty <= 0) { ui.cart.items = ui.cart.items.filter(i => i.productId !== pid); if (!ui.cart.items.length) ui.cart.shopId = null; }
            render();
          }
          return;
        }

        if (t.closest('#btn-open-checkout')) {
          const s = getShop(ui.cart.shopId);
          if (!s) return;
          const sub = ui.cart.items.reduce((a, b) => a + b.price * b.qty, 0);
          const del = calcDeliveryFee(s.distanceKm);
          const disc = ui.promoCode.toUpperCase() === 'JAMUI10' ? Math.round(sub * 0.1) : 0;
          const tot = sub - disc + del;
          openModal(`
            <div class="flex justify-between items-center border-b pb-3 mb-3">
              <h3 class="text-base font-extrabold text-[#0f2942]">चेकआउट (${escapeHtml(s.name)})</h3>
              <button type="button" data-close-modal="1" class="font-bold text-slate-400">✕</button>
            </div>
            <div class="space-y-3 text-xs sm:text-sm">
              <div class="bg-slate-50 p-3 rounded-xl space-y-1">
                ${ui.cart.items.map(i => `<div class="flex justify-between"><span>${escapeHtml(i.name)} × ${i.qty}</span><span>₹${i.price * i.qty}</span></div>`).join('')}
                <div class="border-t pt-1.5 flex justify-between"><span>डिलीवरी शुल्क</span><span>₹${del}</span></div>
                ${disc > 0 ? `<div class="flex justify-between text-emerald-700 font-bold"><span>JAMUI10 छूट</span><span>-₹${disc}</span></div>` : ''}
                <div class="flex justify-between font-extrabold text-sm text-[#0f2942]"><span>कुल देय</span><span>₹${tot}</span></div>
              </div>
              <div class="flex gap-2">
                <input id="chk-promo" type="text" value="${escapeHtml(ui.promoCode)}" placeholder="प्रोमो कोड (JAMUI10)" class="flex-1 px-3 py-2 border rounded-xl text-xs" />
                <button type="button" id="btn-apply-promo" class="bg-slate-800 text-white px-3 py-2 rounded-xl text-xs font-bold">लागू करें</button>
              </div>
              <input id="chk-name" type="text" value="${escapeHtml(ui.profile.name)}" placeholder="आपका नाम *" class="w-full px-3 py-2 border rounded-xl" />
              <input id="chk-phone" type="tel" value="${escapeHtml(ui.profile.phone)}" placeholder="मोबाइल नंबर *" class="w-full px-3 py-2 border rounded-xl" />
              <input id="chk-addr" type="text" value="${escapeHtml(ui.profile.address || ui.selectedArea + ', जमुई')}" placeholder="डिलीवरी पता *" class="w-full px-3 py-2 border rounded-xl" />
              <select id="chk-pay" class="w-full px-3 py-2 border rounded-xl bg-white">
                <option value="कैश ऑन डिलीवरी (COD)">कैश ऑन डिलीवरी (COD)</option>
                <option value="ऑनलाइन पेमेंट (UPI / कार्ड)">ऑनलाइन पेमेंट (UPI / कार्ड)</option>
              </select>
              <button type="button" id="btn-place-order" class="w-full bg-amber-500 hover:bg-amber-600 text-[#0f2942] font-extrabold py-2.5 rounded-xl">ऑर्डर पक्का करें (₹${tot})</button>
            </div>
          `);
          return;
        }

        if (t.closest('#btn-apply-promo')) {
          ui.promoCode = (document.getElementById('chk-promo').value || '').trim();
          closeModal();
          document.getElementById('btn-open-checkout').click();
          return;
        }

        if (t.closest('#btn-place-order')) {
          const name = (document.getElementById('chk-name').value || '').trim();
          const phone = (document.getElementById('chk-phone').value || '').trim();
          const addr = (document.getElementById('chk-addr').value || '').trim();
          const pay = document.getElementById('chk-pay').value;
          if (!name || !phone || !addr) { showToast('कृपया नाम, मोबाइल और पता भरें।', 'error'); return; }
          const s = getShop(ui.cart.shopId);
          if (!s || s.status !== 'approved' || !s.isOpen) { showToast('दुकान अभी उपलब्ध नहीं है।', 'error'); return; }
          for (const ci of ui.cart.items) {
            const sp = s.products.find(x => x.id === ci.productId);
            if (!sp || sp.stock < ci.qty) { showToast(`${ci.name} का स्टॉक कम है।`, 'error'); return; }
          }
          for (const ci of ui.cart.items) {
            const sp = s.products.find(x => x.id === ci.productId);
            if (sp) sp.stock -= ci.qty;
          }
          const sub = ui.cart.items.reduce((a, b) => a + b.price * b.qty, 0);
          const disc = ui.promoCode.toUpperCase() === 'JAMUI10' ? Math.round(sub * 0.1) : 0;
          const del = calcDeliveryFee(s.distanceKm);
          const oid = 'JMU-' + String(shared.nextOrderNum++);
          const otp = String(Math.floor(1000 + Math.random() * 9000));

          ui.profile = { name, phone, address: addr };
          shared.orders.unshift({
            id: oid, shopId: s.id, shopName: s.name, shopArea: s.area,
            customerName: name, customerPhone: phone, customerArea: addr,
            items: ui.cart.items.map(i => ({ name: i.name, qty: i.qty, price: i.price })),
            subtotal: sub, discount: disc, deliveryFee: del, partnerPayout: Math.max(15, del - 5),
            platformCommission: Math.round(sub * 0.05), total: sub - disc + del,
            paymentMethod: pay, status: 'placed', otp: otp, partnerName: null, rating: null, createdAt: 'अभी'
          });
          ui.cart = { shopId: null, items: [] };
          ui.promoCode = '';
          ui.activeShopId = null;
          ui.tab = 'orders';
          saveShared();
          closeModal();
          render();
          showToast(`ऑर्डर #${oid} सफलतापूर्वक दर्ज हुआ!`, 'success');
          return;
        }

        if (t.closest('#btn-save-profile')) {
          ui.profile.name = (document.getElementById('prof-name').value || '').trim();
          ui.profile.phone = (document.getElementById('prof-phone').value || '').trim();
          ui.profile.address = (document.getElementById('prof-addr').value || '').trim();
          showToast('प्रोफ़ाइल सेव हो गई!', 'success');
          return;
        }

        const cBtn = t.closest('[data-cancel]');
        if (cBtn) {
          const o = shared.orders.find(x => x.id === cBtn.dataset.cancel);
          if (o && (o.status === 'placed' || o.status === 'accepted')) { o.status = 'cancelled'; saveShared(); render(); showToast('ऑर्डर रद्द हुआ।', 'warning'); }
          return;
        }

        const rBtn = t.closest('[data-rate]');
        if (rBtn) {
          const oid = rBtn.dataset.rate;
          openModal(`<h3 class="font-bold text-[#0f2942] mb-3">ऑर्डर #${escapeHtml(oid)} को रेटिंग दें</h3><div class="flex justify-center gap-2">${[1,2,3,4,5].map(n => `<button type="button" data-srate="${oid}|${n}" class="px-3.5 py-2 bg-amber-50 border border-amber-200 rounded-xl font-bold text-amber-700">${n} ★</button>`).join('')}</div>`);
          return;
        }
        const srBtn = t.closest('[data-srate]');
        if (srBtn) {
          const [oid, r] = srBtn.dataset.srate.split('|');
          const o = shared.orders.find(x => x.id === oid);
          if (o) { o.rating = Number(r); saveShared(); closeModal(); render(); showToast('धन्यवाद!', 'success'); }
          return;
        }

        const cmpBtn = t.closest('[data-cmp]');
        if (cmpBtn) {
          const oid = cmpBtn.dataset.cmp;
          openModal(`<h3 class="font-bold text-[#0f2942] mb-2">शिकायत (#${escapeHtml(oid)})</h3><textarea id="cmp-msg" rows="3" class="w-full p-2.5 border rounded-xl text-sm mb-3" placeholder="समस्या लिखें..."></textarea><button type="button" id="btn-scmp" data-oid="${escapeHtml(oid)}" class="w-full bg-[#0f2942] text-white font-bold py-2 rounded-xl text-sm">भेजें</button>`);
          return;
        }
        if (t.closest('#btn-scmp')) {
          const oid = t.closest('#btn-scmp').dataset.oid;
          const msg = (document.getElementById('cmp-msg').value || '').trim();
          if (!msg) return;
          shared.complaints.unshift({ id: 'CMP-' + Date.now(), orderId: oid, customerName: ui.profile.name || 'ग्राहक', message: msg, status: 'open' });
          saveShared(); closeModal(); showToast('शिकायत दर्ज की गई।', 'success');
          return;
        }
      });

      document.addEventListener('change', function (e) {
        if (e.target.id === 'select-area') { ui.selectedArea = e.target.value; render(); }
      });
      document.addEventListener('input', function (e) {
        if (e.target.id === 'input-search') {
          ui.searchQuery = e.target.value;
          const pos = e.target.selectionStart;
          render();
          const el = document.getElementById('input-search');
          if (el) { el.focus(); el.setSelectionRange(pos, pos); }
        }
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

      render();
    })();
  </script>
</body>
</html>
