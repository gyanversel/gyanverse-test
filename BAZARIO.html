            ? 'bg-amber-500 text-slate-900'
            : 'bg-emerald-600 text-white';
        const toast = document.createElement('div');
        toast.className = `pointer-events-auto ${colors} px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-semibold flex items-center justify-between gap-2 transition-all`;

        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';

        }, 3000);

                <button type="button" data-csub="orders" class="csub-btn px-3 py-1.5 rounded-lg text-xs font-bold transition ${state.customerSubTab === 'orders' ? 'bg-white text-[#0f2942] shadow-xs' : 'text-slate-600'}">

            ${state.customerSubTab === 'orders' ? renderCustomerOrders() : `

                <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
                  ${SHOP_CATEGORIES.map(cat => `
                    <button type="button" data-cat="${escapeHtml(cat)}" class="cat-chip shrink-0 text-xs font-semibold px-3 py-1.5 rounded-full border border-slate-200 bg-white text-slate-700 transition ${state.selectedCategory === cat ? 'active' : ''}">
                      ${escapeHtml(cat)}
                    </button>
                  `).join('')}
                </div>
              </div>

              <!-- Nearby Shops Grid -->
              <div>
                <div class="flex items-center justify-between mb-2.5">
                  <h2 class="text-sm sm:text-base font-bold text-[#0f2942]">
                    ${state.customerSubTab === 'favorites' ? 'आपकी पसंदीदा दुकानें' : 'CUSTOMER NEARBY MARKET — जमुई'}

                  <span class="text-xs text-slate-500 font-medium">${filteredShops.length} दुकानें उपलब्ध</span>

                ${filteredShops.length === 0 ? `
                  <div class="bg-white rounded-2xl p-8 text-center border border-slate-200">
                    <p class="text-sm text-slate-600 font-medium">इस श्रेणी या खोज के लिए कोई दुकान नहीं मिली।</p>
                  </div>
                ` : `
                  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
                    ${filteredShops.map(shop => {
                      const isFav = state.favorites.includes(shop.id);
                      const delFee = calcDeliveryFee(shop.distanceKm);
                      return `
                        <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs hover:shadow-md transition flex flex-col justify-between">
                          <div>
                            <div class="flex items-start justify-between gap-2">

                                </div>
                                <div>
                                  <span class="text-[10px] font-bold uppercase tracking-wide text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md">${escapeHtml(shop.category)}</span>
                                  <h3 class="text-sm font-bold text-slate-900 mt-1 leading-snug">${escapeHtml(shop.name)}</h3>
                                </div>
                              </div>
                              <button type="button" data-fav-shop="${shop.id}" class="p-1.5 rounded-lg hover:bg-slate-100 transition" title="पसंदीदा में जोड़ें">
                                <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'fill-rose-500 text-rose-500' : 'text-slate-400'}"></i>
                              </button>
                            </div>

                            <div class="mt-3 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-600">
                              <span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400"></i> ${escapeHtml(shop.area)}</span>
                              <span class="flex items-center gap-1 font-semibold text-emerald-700"><i data-lucide="star" class="w-3.5 h-3.5 fill-emerald-500 text-emerald-500"></i> ${shop.rating}</span>
                            </div>
                          </div>

                          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                            <div class="text-xs text-slate-500">

      function renderShopDetail(shopId) {
        const shop = getShopById(shopId);
        if (!shop) {
          state.activeShopId = null;
          return renderCustomerMode();
        }
        return `
          <div class="space-y-4">
            <button type="button" id="btn-back-to-market" class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-bold text-[#0f2942] bg-white border border-slate-200 px-3 py-1.5 rounded-xl hover:bg-slate-50">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
              <span>सभी दुकानों पर वापस जाएं</span>
            </button>

            <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-3">
              <div>
                <span class="text-xs font-bold text-amber-700 bg-amber-50 px-2.5 py-0.5 rounded-full">${escapeHtml(shop.category)}</span>
                <h2 class="text-lg sm:text-xl font-extrabold text-[#0f2942] mt-1.5">${escapeHtml(shop.name)}</h2>
                <p class="text-xs sm:text-sm text-slate-600 mt-0.5">${escapeHtml(shop.area)}, जमुई • ${shop.distanceKm} किमी दूर • डिलीवरी शुल्क ₹${calcDeliveryFee(shop.distanceKm)}</p>
              </div>
              <div class="text-right">
                <div class="inline-flex items-center gap-1 bg-emerald-50 text-emerald-700 px-3 py-1 rounded-xl text-sm font-bold">
                  <i data-lucide="star" class="w-4 h-4 fill-emerald-500 text-emerald-500"></i> ${shop.rating}
                </div>
                <div class="text-[11px] text-slate-500 mt-1">संपर्क: ${escapeHtml(shop.phone)}</div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
              ${shop.products.map(prod => {
                const inCart = state.cart.shopId === shop.id ? state.cart.items.find(i => i.productId === prod.id) : null;
                const qty = inCart ? inCart.qty : 0;
                const discountPct = prod.mrp > prod.price ? Math.round(((prod.mrp - prod.price) / prod.mrp) * 100) : 0;
                return `
                  <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col justify-between shadow-xs">
                    <div>
                      <div class="flex items-start justify-between gap-2">
                        <span class="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">${escapeHtml(prod.brand)}</span>
                        ${discountPct > 0 ? `<span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md">${discountPct}% छूट</span>` : ''}
                      </div>
                      <h3 class="text-sm font-bold text-slate-900 mt-2">${escapeHtml(prod.name)}</h3>
                      <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(prod.desc)}</p>
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                      <div>
                        <span class="text-base font-extrabold text-[#0f2942]">₹${prod.price}</span>
                        ${prod.mrp > prod.price ? `<span class="text-xs text-slate-400 line-through ml-1">₹${prod.mrp}</span>` : ''}
                        <div class="text-[11px] ${prod.stock > 0 ? 'text-emerald-600' : 'text-rose-600'} font-medium">
                          ${prod.stock > 0 ? `स्टॉक: ${prod.stock}` : 'स्टॉक समाप्त'}
                        </div>
                      </div>

                      ${prod.stock <= 0 ? `
                        <span class="text-xs font-bold text-slate-400 px-3 py-1.5 bg-slate-100 rounded-xl">अनुपलब्ध</span>
                      ` : qty === 0 ? `
                        <button type="button" data-add-cart="${shop.id}|${prod.id}" class="bg-amber-500 hover:bg-amber-600 text-[#0f2942] text-xs font-bold px-3.5 py-2 rounded-xl transition">
                          + कार्ट में जोड़ें
                        </button>
                      ` : `
                        <div class="flex items-center gap-2 bg-[#0f2942] text-white rounded-xl px-2 py-1">
                          <button type="button" data-qty-delta="${prod.id}|-1" class="w-6 h-6 rounded-lg hover:bg-white/20 font-bold">-</button>
                          <span class="text-xs font-bold w-4 text-center">${qty}</span>
                          <button type="button" data-qty-delta="${prod.id}|1" class="w-6 h-6 rounded-lg hover:bg-white/20 font-bold">+</button>
                        </div>
                      `}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      function renderCustomerOrders() {
        if (state.orders.length === 0) {
          return `<div class="bg-white rounded-2xl p-8 text-center border border-slate-200 text-sm text-slate-600">अभी तक कोई ऑर्डर नहीं किया गया है।</div>`;
        }
        return `
          <div class="space-y-3.5">
            ${state.orders.map(order => {
              const st = getStatusLabel(order.status);
              const steps = ['placed', 'accepted', 'ready_for_pickup', 'out_for_delivery', 'delivered'];
              const currentIdx = steps.indexOf(order.status);
              return `
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs space-y-3">
                  <div class="flex flex-wrap items-start justify-between gap-2">
                    <div>
                      <div class="flex items-center gap-2">
                        <span class="text-sm font-extrabold text-[#0f2942]">#${escapeHtml(order.id)}</span>
                        <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${st.cls}">${escapeHtml(st.text)}</span>
                      </div>
                      <div class="text-xs text-slate-600 mt-1 font-semibold">${escapeHtml(order.shopName)} (${escapeHtml(order.shopArea)})</div>
                      <div class="text-[11px] text-slate-500">ग्राहक पता: ${escapeHtml(order.customerArea)} • ${escapeHtml(order.paymentMethod)}</div>
                    </div>
                    <div class="text-right">
                      <div class="text-base font-extrabold text-[#0f2942]">₹${order.total}</div>
                      <div class="text-[11px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md mt-1">डिलीवरी OTP: ${escapeHtml(order.otp)}</div>
                    </div>
                  </div>

                  <div class="text-xs text-slate-700 bg-slate-50 rounded-xl p-2.5">
                    ${order.items.map(i => `${escapeHtml(i.name)} × ${i.qty} (₹${i.price * i.qty})`).join(' • ')}
                  </div>

                  ${currentIdx >= 0 ? `
                    <div class="grid grid-cols-5 gap-1 pt-1">
                      ${['ऑर्डर', 'स्वीकृत', 'तैयार', 'रास्ते में', 'डिलीवर'].map((lbl, idx) => `
                        <div class="text-center">
                          <div class="h-1.5 rounded-full ${idx <= currentIdx ? 'bg-emerald-500' : 'bg-slate-200'}"></div>
                          <div class="text-[10px] mt-1 font-semibold ${idx <= currentIdx ? 'text-emerald-700' : 'text-slate-400'}">${lbl}</div>
                        </div>
                      `).join('')}
                    </div>
                  ` : ''}

                  <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100 text-xs">
                    <div class="text-slate-600">
                      ${order.partnerName ? `<span class="font-semibold text-indigo-700">डिलीवरी पार्टनर: ${escapeHtml(order.partnerName)}</span>` : 'ओपन डिलीवरी नेटवर्क: पार्टनर प्रतीक्षारत'}
                    </div>
                    <div class="flex items-center gap-2">
                      ${(order.status === 'placed' || order.status === 'accepted') ? `
                        <button type="button" data-cancel-order="${order.id}" class="text-rose-600 hover:bg-rose-50 font-bold px-2.5 py-1 rounded-lg border border-rose-200">ऑर्डर रद्द करें</button>
                      ` : ''}
                      ${order.status === 'delivered' && !order.rating ? `
                        <button type="button" data-rate-order="${order.id}" class="text-amber-700 hover:bg-amber-50 font-bold px-2.5 py-1 rounded-lg border border-amber-200">रेटिंग दें ★</button>
                      ` : order.rating ? `<span class="font-bold text-emerald-700">आपकी रेटिंग: ${order.rating} ★</span>` : ''}
                      <button type="button" data-complain-order="${order.id}" class="text-slate-600 hover:bg-slate-100 font-semibold px-2.5 py-1 rounded-lg border border-slate-200">शिकायत/सहायता</button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      /* ===================== 2. MERCHANT MODE ===================== */
      function renderMerchantMode() {
        const shop = getShopById(state.merchantShopId) || state.shops[0];
        const shopOrders = state.orders.filter(o => o.shopId === shop.id);
        const completedOrders = shopOrders.filter(o => o.status === 'delivered');
        const grossSales = completedOrders.reduce((sum, o) => sum + o.subtotal, 0);
        const commission = Math.round(grossSales * 0.05);
        const netEarnings = grossSales - commission;

        return `
          <div class="space-y-4">
            <!-- Merchant Selector & Register Button -->
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-3">
              <div>
                <div class="text-xs text-slate-500 font-semibold">सक्रिय दुकानदार डैशबोर्ड</div>
                <select id="select-merchant-shop" class="mt-0.5 text-sm sm:text-base font-bold text-[#0f2942] bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5">
                  ${state.shops.map(s => `<option value="${s.id}" ${s.id === shop.id ? 'selected' : ''}>${escapeHtml(s.name)} (${escapeHtml(s.area)})</option>`).join('')}
                </select>
              </div>
              <button type="button" id="btn-open-register-shop" class="bg-amber-500 hover:bg-amber-600 text-[#0f2942] text-xs sm:text-sm font-bold px-4 py-2 rounded-xl flex items-center gap-1.5 transition">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>नई दुकान रजिस्टर करें</span>
              </button>
            </div>

            <!-- Earnings KPIs -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div class="bg-white p-3.5 rounded-2xl border border-slate-200">
                <div class="text-xs text-slate-500">कुल ऑर्डर</div>
                <div class="text-xl font-extrabold text-[#0f2942] mt-1">${shopOrders.length}</div>
              </div>
              <div class="bg-white p-3.5 rounded-2xl border border-slate-200">
                <div class="text-xs text-slate-500">कुल बिक्री (डिलीवर)</div>
                <div class="text-xl font-extrabold text-emerald-700 mt-1">₹${grossSales}</div>
              </div>
              <div class="bg-white p-3.5 rounded-2xl border border-slate-200">
                <div class="text-xs text-slate-500">प्लेटफॉर्म कमीशन (5%)</div>
                <div class="text-xl font-extrabold text-amber-600 mt-1">₹${commission}</div>
              </div>
              <div class="bg-white p-3.5 rounded-2xl border border-slate-200">
                <div class="text-xs text-slate-500">शुद्ध दुकानदार कमाई</div>
                <div class="text-xl font-extrabold text-[#0f2942] mt-1">₹${netEarnings}</div>
              </div>
            </div>

            <!-- Order Management -->
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
              <h2 class="text-base font-bold text-[#0f2942] mb-3">ऑर्डर मैनेजमेंट (Order Management)</h2>
              ${shopOrders.length === 0 ? `<p class="text-xs text-slate-500">इस दुकान के लिए अभी कोई ऑर्डर नहीं है। ग्राहक ऐप से ऑर्डर करके टेस्ट करें।</p>` : `
                <div class="space-y-3">
                  ${shopOrders.map(o => {
                    const st = getStatusLabel(o.status);
                    return `
                      <div class="border border-slate-200 rounded-xl p-3 flex flex-wrap items-center justify-between gap-3">
                        <div>
                          <div class="flex items-center gap-2">
                            <span class="text-sm font-bold text-[#0f2942]">#${escapeHtml(o.id)}</span>
                            <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${st.cls}">${escapeHtml(st.text)}</span>
                          </div>
                          <div class="text-xs text-slate-600 mt-1">ग्राहक: ${escapeHtml(o.customerName)} (${escapeHtml(o.customerArea)}) • ₹${o.subtotal}</div>
                          <div class="text-[11px] text-slate-500 mt-0.5">${o.items.map(i => `${escapeHtml(i.name)} × ${i.qty}`).join(', ')}</div>
                        </div>
                        <div class="flex items-center gap-2">
                          ${o.status === 'placed' ? `
                            <button type="button" data-m-action="accept|${o.id}" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">स्वीकार करें</button>
                            <button type="button" data-m-action="reject|${o.id}" class="bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs font-bold px-3 py-1.5 rounded-lg">अस्वीकार</button>
                          ` : o.status === 'accepted' ? `
                            <button type="button" data-m-action="ready|${o.id}" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">ऑर्डर तैयार है (डिलीवरी भेजें)</button>
                          ` : ''}
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>

            <!-- Product Management -->
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-xs">
              <div class="flex items-center justify-between mb-3">
                <h2 class="text-base font-bold text-[#0f2942]">प्रोडक्ट और स्टॉक मैनेजमेंट</h2>
                <button type="button" id="btn-open-add-product" class="bg-[#0f2942] hover:bg-[#1a3d5f] text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> नया प्रोडक्ट जोड़ें
                </button>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="border-b border-slate-200 text-slate-500">
                      <th class="py-2 pr-3">प्रोडक्ट</th>
                      <th class="py-2 pr-3">ब्रांड</th>
                      <th class="py-2 pr-3">कीमत</th>
                      <th class="py-2 pr-3">स्टॉक</th>
                      <th class="py-2 text-right">अपडेट</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${shop.products.map(p => `
                      <tr class="border-b border-slate-100">
                        <td class="py-2.5 pr-3 font-semibold text-slate-800">${escapeHtml(p.name)}</td>
                        <td class="py-2.5 pr-3 text-slate-600">${escapeHtml(p.brand)}</td>
                        <td class="py-2.5 pr-3 font-bold text-[#0f2942]">₹${p.price}</td>

                        <td class="py-2.5 text-right">
                          <button type="button" data-stock-add="${shop.id}|${p.id}" class="text-xs font-bold bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded-lg">+5 स्टॉक</button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }

      /* ===================== 3. DELIVERY PARTNER MODE ===================== */
      function renderDeliveryMode() {
        const poolOrders = state.orders.filter(o => o.status === 'ready_for_pickup');
        const activeDeliveries = state.orders.filter(o => o.status === 'out_for_delivery');

          <div class="space-y-3 text-sm">
            <input id="reg-shop-name" type="text" placeholder="दुकान का नाम (जैसे: माँ तारा किराना)" class="w-full px-3 py-2 border border-slate-300 rounded-xl" />
            <input id="reg-owner-name" type="text" placeholder="दुकानदार का नाम" class="w-full px-3 py-2 border border-slate-300 rounded-xl" />
            <input id="reg-shop-phone" type="tel" placeholder="मोबाइल नंबर" class="w-full px-3 py-2 border border-slate-300 rounded-xl" />
            <select id="reg-shop-cat" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white">
              ${SHOP_CATEGORIES.filter(c => c !== 'सभी').map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
            </select>
            <select id="reg-shop-area" class="w-full px-3 py-2 border border-slate-300 rounded-xl bg-white">
              ${JAMUI_AREAS.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('')}
            </select>
            <button type="button" id="btn-submit-shop" class="w-full bg-[#0f2942] hover:bg-[#1a3d5f] text-white font-bold py-2.5 rounded-xl">रजिस्ट्रेशन सबमिट करें</button>
          </div>
        `);
      }

      function openAddProductModal() {
        openModal(`
          <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-4">
            <h3 class="text-base font-extrabold text-[#0f2942]">नया प्रोडक्ट जोड़ें</h3>
            <button type="button" data-close-modal="1" class="text-slate-400 hover:text-slate-700 font-bold text-lg">✕</button>
          </div>
          <div class="space-y-3 text-sm">
            <input id="new-prod-name" type="text" placeholder="प्रोडक्ट का नाम" class="w-full px-3 py-2 border border-slate-300 rounded-xl" />
            <div class="grid grid-cols-2 gap-2">
              <input id="new-prod-price" type="number" placeholder="कीमत (₹)" class="w-full px-3 py-2 border border-slate-300 rounded-xl" />
              <input id="new-prod-stock" type="number" placeholder="स्टॉक संख्या" class="w-full px-3 py-2 border border-slate-300 rounded-xl" />
            </div>
            <input id="new-prod-brand" type="text" placeholder="ब्रांड (जैसे: Amul / लोकल)" class="w-full px-3 py-2 border border-slate-300 rounded-xl" />
            <input id="new-prod-desc" type="text" placeholder="संक्षिप्त विवरण" class="w-full px-3 py-2 border border-slate-300 rounded-xl" />
            <button type="button" id="btn-submit-product" class="w-full bg-amber-500 hover:bg-amber-600 text-[#0f2942] font-bold py-2.5 rounded-xl">प्रोडक्ट अपलोड करें</button>
          </div>
        `);
      }

      /* ===================== GLOBAL EVENT DELEGATION ===================== */
      document.addEventListener('click', function (e) {
        const target = e.target;

        // Mode switch
        const modeBtn = target.closest('.mode-pill');
        if (modeBtn) {
          state.currentMode = modeBtn.dataset.mode;
          state.activeShopId = null;
          saveState();
          render();
          return;
        }

        // Reset Demo
        if (target.closest('#btn-reset-demo')) {
          state = createInitialState();
          saveState();
          render();
          showToast('डेमो डेटा सफलतापूर्वक रीसेट किया गया।', 'success');
          return;
        }

        // Close modal
        if (target.closest('[data-close-modal]') || target.id === 'modal-overlay') {
          closeModal();
          return;
        }

        // Customer sub-tabs
        const csub = target.closest('.csub-btn');
        if (csub) {
          state.customerSubTab = csub.dataset.csub;
          state.activeShopId = null;
          saveState();
          render();
          return;
        }

        // Category chip
        const catBtn = target.closest('.cat-chip');
        if (catBtn) {
          state.selectedCategory = catBtn.dataset.cat;
          saveState();
          render();
          return;
        }

        // Favorite toggle
        const favBtn = target.closest('[data-fav-shop]');
        if (favBtn) {
          const sid = favBtn.dataset.favShop;
          const idx = state.favorites.indexOf(sid);
          if (idx >= 0) {
            state.favorites.splice(idx, 1);
            showToast('पसंदीदा लिस्ट से हटाया गया।', 'warning');
          } else {
            state.favorites.push(sid);
            showToast('पसंदीदा दुकानों में जोड़ा गया।', 'success');
          }
          saveState();
          render();
          return;
        }

        // Open shop detail
        const openShopBtn = target.closest('[data-open-shop]');
        if (openShopBtn) {
          state.activeShopId = openShopBtn.dataset.openShop;
          saveState();
          render();
          return;
        }

        // Back to market
        if (target.closest('#btn-back-to-market')) {
          state.activeShopId = null;
          saveState();
          render();
          return;
        }

        // Add to cart
        const addBtn = target.closest('[data-add-cart]');
        if (addBtn) {
          const [shopId, prodId] = addBtn.dataset.addCart.split('|');
          const shop = getShopById(shopId);
          const prod = shop && shop.products.find(p => p.id === prodId);
          if (!shop || !prod) return;

          if (state.cart.shopId && state.cart.shopId !== shopId && state.cart.items.length > 0) {
            openModal(`
              <h3 class="text-base font-extrabold text-[#0f2942] mb-2">नया कार्ट शुरू करें?</h3>
              <p class="text-xs sm:text-sm text-slate-600 mb-4">पहले चरण में एक समय में एक ही दुकान से ऑर्डर किया जा सकता है। क्या आप पिछली दुकान का कार्ट खाली करके इस दुकान से सामान जोड़ना चाहते हैं?</p>
              <div class="flex justify-end gap-2">
                <button type="button" data-close-modal="1" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700">नहीं</button>
                <button type="button" id="btn-replace-cart" data-payload="${shopId}|${prodId}" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-amber-500 text-[#0f2942]">हाँ, नया कार्ट बनाएं</button>
              </div>
            `);
            return;
          }

          state.cart.shopId = shopId;
          state.cart.items.push({ productId: prod.id, name: prod.name, price: prod.price, qty: 1 });
          saveState();
          render();
          showToast(`${prod.name} कार्ट में जोड़ा गया।`, 'success');
          return;
        }

        if (target.closest('#btn-replace-cart')) {
          const [shopId, prodId] = target.closest('#btn-replace-cart').dataset.payload.split('|');
          const shop = getShopById(shopId);
          const prod = shop && shop.products.find(p => p.id === prodId);
          if (shop && prod) {
            state.cart = { shopId: shopId, items: [{ productId: prod.id, name: prod.name, price: prod.price, qty: 1 }] };
            closeModal();
            saveState();
            render();
            showToast('नया कार्ट तैयार है।', 'success');
          }
          return;
        }

        // Qty delta
        const qtyBtn = target.closest('[data-qty-delta]');
        if (qtyBtn) {
          const [prodId, deltaStr] = qtyBtn.dataset.qtyDelta.split('|');
          const delta = parseInt(deltaStr, 10);
          const item = state.cart.items.find(i => i.productId === prodId);
          if (item) {
            item.qty += delta;
            if (item.qty <= 0) {
              state.cart.items = state.cart.items.filter(i => i.productId !== prodId);
              if (state.cart.items.length === 0) state.cart.shopId = null;
            }
            saveState();
            render();
          }
          return;
        }

        // Open checkout
        if (target.closest('#btn-open-checkout')) {
          openCheckoutModal();
          return;
        }

        // Place order
        if (target.closest('#btn-place-order')) {
          const name = (document.getElementById('chk-name').value || '').trim();
          const phone = (document.getElementById('chk-phone').value || '').trim();
          const addr = (document.getElementById('chk-addr').value || '').trim();
          const pay = document.getElementById('chk-pay').value;
          if (!name || !phone || !addr) {
            showToast('कृपया नाम, मोबाइल और पता भरें।', 'error');
            return;
          }
          const shop = getShopById(state.cart.shopId);
          if (!shop) return;
          const subtotal = state.cart.items.reduce((s, i) => s + i.price * i.qty, 0);
          const delFee = calcDeliveryFee(shop.distanceKm);
          const otp = String(Math.floor(1000 + Math.random() * 9000));
          const orderId = 'JMU-' + String(1001 + state.orders.length);

          state.orders.unshift({
            id: orderId,
            shopId: shop.id,
            shopName: shop.name,
            shopArea: shop.area,
            customerName: name,
            customerPhone: phone,
            customerArea: addr,
            items: state.cart.items.map(i => ({ name: i.name, qty: i.qty, price: i.price })),
            subtotal: subtotal,
            deliveryFee: delFee,
            partnerPayout: Math.max(15, delFee - 5),
            platformCommission: Math.round(subtotal * 0.05),
            total: subtotal + delFee,
            paymentMethod: pay,
            status: 'placed',
            otp: otp,
            partnerName: null,
            rating: null,
            createdAt: 'अभी'
          });

          state.cart = { shopId: null, items: [] };
          state.activeShopId = null;
          state.customerSubTab = 'orders';
          state.merchantShopId = shop.id;
          closeModal();
          saveState();
          render();
          showToast(`ऑर्डर #${orderId} सफलतापूर्वक हो गया! अब दुकानदार ऐप से स्वीकार करें।`, 'success');
          return;
        }

        // Cancel order
        const cancelBtn = target.closest('[data-cancel-order]');
        if (cancelBtn) {
          const oid = cancelBtn.dataset.cancelOrder;
          const order = state.orders.find(o => o.id === oid);
          if (order && (order.status === 'placed' || order.status === 'accepted')) {
            order.status = 'cancelled';
            saveState();
            render();
            showToast(`ऑर्डर #${oid} रद्द कर दिया गया।`, 'warning');
          }
          return;
        }

        // Rate order
        const rateBtn = target.closest('[data-rate-order]');
        if (rateBtn) {
          const oid = rateBtn.dataset.rateOrder;
          openModal(`
            <h3 class="text-base font-extrabold text-[#0f2942] mb-2">दुकान और डिलीवरी को रेटिंग दें</h3>
            <p class="text-xs text-slate-600 mb-3">ऑर्डर #${escapeHtml(oid)} के लिए अपना अनुभव चुनें:</p>
            <div class="flex justify-center gap-2 mb-4">
              ${[1, 2, 3, 4, 5].map(n => `<button type="button" data-submit-rate="${oid}|${n}" class="px-3.5 py-2 rounded-xl bg-amber-50 hover:bg-amber-500 hover:text-white text-amber-700 font-extrabold text-sm border border-amber-200">${n} ★</button>`).join('')}
            </div>
          `);
          return;
        }

        const submitRate = target.closest('[data-submit-rate]');
        if (submitRate) {
          const [oid, r] = submitRate.dataset.submitRate.split('|');
          const order = state.orders.find(o => o.id === oid);
          if (order) {
            order.rating = Number(r);
            closeModal();
            saveState();
            render();
            showToast('रेटिंग देने के लिए धन्यवाद!', 'success');
          }
          return;
        }

        // Complaint modal
        const cmpBtn = target.closest('[data-complain-order]');
        if (cmpBtn) {
          const oid = cmpBtn.dataset.complainOrder;
          openModal(`
            <h3 class="text-base font-extrabold text-[#0f2942] mb-2">शिकायत एवं ग्राहक सहायता</h3>
            <p class="text-xs text-slate-600 mb-3">ऑर्डर #${escapeHtml(oid)} से जुड़ी समस्या लिखें:</p>
            <textarea id="cmp-text" rows="3" placeholder="अपनी समस्या यहाँ लिखें..." class="w-full p-3 border border-slate-300 rounded-xl text-sm mb-3"></textarea>
            <div class="flex justify-end gap-2">
              <button type="button" data-close-modal="1" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-100">रद्द करें</button>
              <button type="button" id="btn-submit-cmp" data-oid="${escapeHtml(oid)}" class="px-4 py-2 rounded-xl text-xs font-bold bg-[#0f2942] text-white">शिकायत भेजें</button>
            </div>
          `);
          return;
        }

        if (target.closest('#btn-submit-cmp')) {
          const oid = target.closest('#btn-submit-cmp').dataset.oid;
          const msg = (document.getElementById('cmp-text').value || '').trim();
          if (!msg) {
            showToast('कृपया समस्या लिखें।', 'error');
            return;
          }
          state.complaints.unshift({
            id: 'CMP-' + String(101 + state.complaints.length),
            orderId: oid,
            customerName: 'ग्राहक (जमुई)',
            message: msg,
            status: 'open'
          });
          closeModal();
          saveState();
          render();
          showToast('शिकायत एडमिन पैनल में दर्ज हो गई है।', 'success');
          return;
        }

        // Merchant actions
        const mAction = target.closest('[data-m-action]');
        if (mAction) {
          const [act, oid] = mAction.dataset.mAction.split('|');
          const order = state.orders.find(o => o.id === oid);
          if (order) {
            if (act === 'accept') {
              order.status = 'accepted';
              showToast(`ऑर्डर #${oid} स्वीकार किया गया।`, 'success');
            } else if (act === 'reject') {
              order.status = 'rejected';
              showToast(`ऑर्डर #${oid} अस्वीकार किया गया।`, 'warning');
            } else if (act === 'ready') {
              order.status = 'ready_for_pickup';
              showToast(`ऑर्डर #${oid} ओपन डिलीवरी नेटवर्क में भेजा गया!`, 'success');
            }
            saveState();
            render();
          }
          return;
        }

        if (target.closest('#btn-open-register-shop')) {
          openRegisterShopModal();
          return;
        }

        if (target.closest('#btn-submit-shop')) {
          const name = (document.getElementById('reg-shop-name').value || '').trim();
          const owner = (document.getElementById('reg-owner-name').value || '').trim();
          const phone = (document.getElementById('reg-shop-phone').value || '').trim();
          const cat = document.getElementById('reg-shop-cat').value;
          const area = document.getElementById('reg-shop-area').value;
          if (!name || !owner || !phone) {
            showToast('कृपया सभी विवरण भरें।', 'error');
            return;
          }
          state.shops.push({
            id: 'shop-' + String(state.shops.length + 1),
            name: name,
            category: cat,
            area: area,
            owner: owner,
            phone: phone,
            distanceKm: 1.0,
            rating: 4.5,
            status: 'pending',
            isOpen: true,
            icon: 'store',
            products: [
              { id: 'p-new-1', name: 'नमूना प्रोडक्ट (कीमत अपडेट करें)', price: 100, mrp: 120, stock: 10, brand: 'लोकल', desc: 'नई दुकान का शुरुआती सामान' }
            ]
          });
          closeModal();
          saveState();
          render();
          showToast('दुकान रजिस्टर हो गई! एडमिन पैनल से अप्रूवल करें।', 'success');
          return;
        }

        if (target.closest('#btn-open-add-product')) {
          openAddProductModal();
          return;
        }

        if (target.closest('#btn-submit-product')) {
          const name = (document.getElementById('new-prod-name').value || '').trim();
          const price = Number(document.getElementById('new-prod-price').value);
          const stock = Number(document.getElementById('new-prod-stock').value);
          const brand = (document.getElementById('new-prod-brand').value || 'लोकल').trim();
          const desc = (document.getElementById('new-prod-desc').value || 'गुणवत्तापूर्ण उत्पाद').trim();
          if (!name || !price || price <= 0) {
            showToast('कृपया सही नाम और कीमत दर्ज करें।', 'error');
            return;
          }
          const shop = getShopById(state.merchantShopId);
          if (shop) {
            shop.products.unshift({
              id: 'p-' + Date.now(),
              name: name,
              price: price,
              mrp: Math.round(price * 1.1),
              stock: stock > 0 ? stock : 10,
              brand: brand,
              desc: desc
            });
            closeModal();
            saveState();
            render();
            showToast(`${name} सफलतापूर्वक जोड़ा गया!`, 'success');
          }
          return;
        }

        const stockBtn = target.closest('[data-stock-add]');
        if (stockBtn) {
          const [sid, pid] = stockBtn.dataset.stockAdd.split('|');
          const shop = getShopById(sid);
          const prod = shop && shop.products.find(p => p.id === pid);
          if (prod) {
            prod.stock += 5;
            saveState();
            render();
            showToast(`${prod.name} का स्टॉक +5 बढ़ाया गया।`, 'success');
          }
          return;
        }

        // Delivery Partner actions
        if (target.closest('#btn-toggle-duty')) {
          state.deliveryOnline = !state.deliveryOnline;
          saveState();
          render();
          return;
        }

        if (target.closest('#btn-settle-cod')) {
          const settled = state.deliveryCodCollected;
          state.deliveryCodCollected = 0;
          saveState();
          render();
          showToast(`₹${settled} COD कैश सफलतापूर्वक जमा हो गया!`, 'success');
          return;
        }

        const dAccept = target.closest('[data-d-accept]');
        if (dAccept) {
          const oid = dAccept.dataset.dAccept;
          const order = state.orders.find(o => o.id === oid);
          if (order && order.status === 'ready_for_pickup') {
            if (order.total > state.deliveryOrderValueLimit) {
              showToast(`यह ऑर्डर (₹${order.total}) आपकी ₹${state.deliveryOrderValueLimit} ऑर्डर वैल्यू सीमा से अधिक है।`, 'error');
              return;
            }
            if (order.paymentMethod.includes('COD') && (state.deliveryCodCollected + order.total > state.deliveryCodLimit)) {
              showToast(`COD कैश सीमा (₹${state.deliveryCodLimit}) पार हो रही है! पहले बकाया कैश जमा करें।`, 'error');
              return;
            }
            order.status = 'out_for_delivery';
            order.partnerName = state.deliveryPartnerName;
            saveState();
            render();
            showToast(`ऑर्डर #${oid} पिकअप किया गया! ग्राहक OTP से डिलीवर करें।`, 'success');
          }
          return;
        }

        const dComplete = target.closest('[data-d-complete]');
        if (dComplete) {
          const oid = dComplete.dataset.dComplete;
          const order = state.orders.find(o => o.id === oid);
          const inputEl = document.getElementById('otp-input-' + oid);
          const enteredOtp = inputEl ? inputEl.value.trim() : '';
          if (!order) return;
          if (enteredOtp !== order.otp) {
            showToast(`गलत OTP! सही ग्राहक OTP (${order.otp}) दर्ज करें।`, 'error');
            return;
          }
          order.status = 'delivered';
          state.deliveryEarnings += order.partnerPayout;
          if (order.paymentMethod.includes('COD')) {
            state.deliveryCodCollected += order.total;
          }
          saveState();
          render();
          showToast(`ऑर्डर #${oid} डिलीवर हुआ! ₹${order.partnerPayout} कमाई जुड़ी।`, 'success');
          return;
        }

        // Admin actions
        const adminShopBtn = target.closest('[data-admin-shop]');
        if (adminShopBtn) {
          const [act, sid] = adminShopBtn.dataset.adminShop.split('|');
          const shop = getShopById(sid);
          if (shop) {
            shop.status = act === 'approve' ? 'approved' : 'blocked';
            saveState();
            render();
            showToast(`${shop.name} की स्थिति अपडेट हुई।`, 'success');
          }
          return;
        }

        const cmpResolveBtn = target.closest('[data-resolve-cmp]');
        if (cmpResolveBtn) {
          const cid = cmpResolveBtn.dataset.resolveCmp;
          const cmp = state.complaints.find(c => c.id === cid);
          if (cmp) {
            cmp.status = 'resolved';
            saveState();
            render();
            showToast('शिकायत का समाधान दर्ज किया गया।', 'success');
          }
          return;
        }
      });

      document.addEventListener('change', function (e) {
        if (e.target.id === 'select-customer-area') {
          state.selectedArea = e.target.value;
          saveState();
          render();
        } else if (e.target.id === 'select-merchant-shop') {
          state.merchantShopId = e.target.value;
          saveState();
          render();
        } else if (e.target.id === 'admin-cod-limit') {
          state.deliveryCodLimit = Number(e.target.value);
          saveState();
          render();
          showToast(`COD कैश सीमा ₹${state.deliveryCodLimit} सेट की गई।`, 'success');
        } else if (e.target.id === 'admin-val-limit') {
          state.deliveryOrderValueLimit = Number(e.target.value);
          saveState();
          render();
          showToast('ऑर्डर वैल्यू सीमा अपडेट की गई।', 'success');
        }
      });

      document.addEventListener('input', function (e) {
        if (e.target.id === 'input-customer-search') {
          state.searchQuery = e.target.value;
          saveState();
          const pos = e.target.selectionStart;
          render();
          const newInput = document.getElementById('input-customer-search');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(pos, pos);
          }
        }
      });

      render();
    })();
  </script>
</body>
</html>
```
